name: Deploy calendar scheduler to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct original HTML
        run: |
          mkdir -p _site
          cat site-src/part-*.b64 | base64 --decode > _site/index.html
          touch _site/.nojekyll

      - name: Verify source checksum
        run: echo "19bd0e6171121352fa74e5537ccb099e157e96d72759bde0995a8703f5c69618  _site/index.html" | sha256sum --check --strict

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
