<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpecBridge · 工程詢價</title><style>body{margin:0;background:#f5f7fa;color:#23334a;font:14px system-ui,'Microsoft JhengHei',sans-serif}*{box-sizing:border-box}header{background:#12233a;color:white;padding:21px 30px;display:flex;justify-content:space-between}header b{font-size:22px}header em{color:#5dd2bb;font-style:normal}.layout{display:grid;grid-template-columns:210px 1fr;min-height:90vh}aside{background:white;border-right:1px solid #e4eaf0;padding:25px 14px}aside button{display:block;width:100%;margin:6px 0;text-align:left;padding:13px;background:transparent;border:0;color:#66778a;cursor:pointer;border-radius:8px}aside button:hover,aside button.on{background:#e7f4f1;color:#087b70}main{padding:35px;max-width:1300px;width:100%}h1{font-size:29px;margin:5px 0}h2{font-size:18px}.label{color:#068979;font-weight:bold;letter-spacing:2px;font-size:11px}p{color:#718298}.btn{border:0;background:#087f74;color:white;border-radius:8px;padding:12px 18px;cursor:pointer}.btn.alt{background:#e4f3f0;color:#087b70}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.box{background:#fff;border:1px solid #e7edf2;border-radius:12px;padding:22px;margin-bottom:18px;box-shadow:0 2px 10px #172c4408}.box small{color:#8392a5}.box strong{display:block;font-size:28px;margin-top:10px}.notice{background:#fff6e6;color:#956a28;padding:14px;border:1px solid #f3dfbd;border-radius:8px;margin:17px 0;font-size:12px}.row{padding:15px 0;border-top:1px solid #e8edf3;cursor:pointer}.row:hover{background:#f6fbfa}.tag{background:#e4f6ee;color:#178362;border-radius:30px;padding:5px 10px;font-size:11px;float:right}.muted{color:#8594a5;font-size:12px}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #dbe4ed;border-radius:8px;font:inherit}.field textarea{min-height:115px}table{width:100%;border-collapse:collapse}td,th{padding:16px 13px;text-align:left;border-bottom:1px solid #e7edf2;vertical-align:top;font-size:12px}th{color:#6f7f93;background:#f8fafb}.scroll{overflow:auto}.tabs{display:flex;gap:10px;margin:20px 0}.tabs button{background:#eef3f6;color:#5c7084;border:0;border-radius:8px;padding:10px 17px;cursor:pointer}.tabs .on{background:#dff1ed;color:#087a6e}.message{padding:13px;border:1px solid #e4e9ed;border-radius:8px;margin:10px 0}.message.mine{background:#e5f5f1;margin-left:30px}@media(max-width:750px){.layout{display:block}aside{display:flex;overflow:auto;padding:10px}aside button{white-space:nowrap;width:auto}main{padding:20px}.grid{grid-template-columns:1fr 1fr}.head{display:block}} </style><header><b>▦ Spec<em>Bridge</em></b><span id="who">工程師展示介面</span></header><div class="layout"><aside id="menu"></aside><main id="main"></main></div><script>let projects=[{id:'RFQ-2026-001',name:'製程管線改造與配管工程',type:'機械／配管',due:'2026-11-05',rev:'Rev. B',scope:'4 至 8 吋不鏽鋼管線拆改、管架設計、材料供應、現場安裝、NDT、壓力試驗、試車與竣工文件。',bids:[{vendor:'永信工程',price:2850000,days:75,tech:93,cover:'供料、拆管、配管、NDT、試車、竣工文件',note:'包含現有管線拆除與清運。',msgs:[['工程師','請確認是否含拆除清運。'],['永信工程','本案已包含。']]},{vendor:'宏達機電',price:2680000,days:90,tech:85,cover:'供料、配管、試車、竣工文件',note:'第三方 NDT 另計。',msgs:[]},{vendor:'泰昇工業',price:3100000,days:60,tech:90,cover:'供料、拆管、配管、NDT、試車、竣工文件',note:'含 12 個月保固。',msgs:[]}]},{id:'RFQ-2026-002',name:'現場控制盤 LCP 與儀表配線工程',type:'電氣／儀控',due:'2026-11-12',rev:'Rev. A',scope:'LCP 設計製造、現場電纜與儀表配線、FAT / SAT、Loop Check、竣工文件。',bids:[]},{id:'RFQ-2026-003',name:'設備平台鋼構增設工程',type:'鋼構／土建',due:'2026-10-29',rev:'Rev. A',scope:'鋼構平台設計、材料供應、加工、吊裝、塗裝及驗收。',bids:[]}];let role='engineer',vendor='永信工程',page='home',ix=0,vix=0,tab='spec';const el=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cash(n){return 'NT$ '+Number(n).toLocaleString('zh-TW')}function go(p){page=p;render()}function selectProject(i){ix=i;tab='spec';go('detail')}function head(k,t,s,right=''){return '<div class="head"><div><div class="label">'+k+'</div><h1>'+t+'</h1><p>'+s+'</p></div>'+right+'</div>'}function warn(){return '<div class="notice">展示版本：所有資料僅存在目前開啟的瀏覽器，沒有正式登入、持久化資料庫與安全廠商隔離。請勿輸入真實工程規範或報價。</div>'}function home(){return head('WORKSPACE / 工作總覽',role==='engineer'?'工程詢價管理中心':'受邀詢價工作台','管理詢價規範、技術澄清及獨立廠商提案。',role==='engineer'?'<button class="btn" onclick="go(\'new\')">＋ 建立專案</button>':'')+warn()+'<div class="grid">'+[['詢價專案',projects.length],['廠商回覆',projects.reduce((a,p)=>a+p.bids.length,0)],['詢價進行中',3],['模擬問答',2]].map(x=>'<div class="box"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="box"><h2>近期工程詢價</h2>'+projects.map((p,i)=>'<div class="row" onclick="selectProject('+i+')"><span class="tag">詢價中</span><span class="muted">'+p.id+' · '+p.rev+'</span><br><b>'+esc(p.name)+'</b><div class="muted">截止 '+p.due+'</div></div>').join('')+'</div>'}function list(){return head('RFQ PROJECTS','工程詢價專案','共用規範、獨立報價與逐案管理。')+'<div class="box scroll"><table><tr><th>專案</th><th>類別</th><th>版本</th><th>截止日</th><th>回覆</th></tr>'+projects.map((p,i)=>'<tr onclick="selectProject('+i+')" style="cursor:pointer"><td><b>'+esc(p.name)+'</b><div class="muted">'+p.id+'</div></td><td>'+p.type+'</td><td>'+p.rev+'</td><td>'+p.due+'</td><td>'+p.bids.length+' 家 →</td></tr>').join('')+'</table></div>'}function detail(){let p=projects[ix],bids=role==='engineer'?p.bids:p.bids.filter(b=>b.vendor===vendor);return '<button class="btn alt" onclick="go(\'list\')">← 專案列表</button>'+head(p.id+' · '+p.rev,esc(p.name),p.type+'　|　截止日 '+p.due)+'<div class="tabs">'+[['spec','詢價規範'],['offers','廠商提案'],['chat','專屬溝通']].map(x=>'<button class="'+(tab===x[0]?'on':'')+'" onclick="tab=\''+x[0]+'\';render()">'+x[1]+'</button>').join('')+'</div>'+(tab==='spec'?'<div class="box"><h2>技術規範 '+p.rev+'</h2><p>'+esc(p.scope)+'</p>'+['工程設計與審查','材料供應','現場施工與安裝','檢驗測試與驗收','文件交付'].map(x=>'<div class="row">✓　'+x+'</div>').join('')+'<p><button class="btn" onclick="go(\''+(role==='engineer'?'compare':'bid')+'\')">'+(role==='engineer'?'檢視技術比價':'填寫報價提案')+'</button></p></div>':tab==='offers'?'<div class="box"><h2>已提交提案</h2>'+(bids.length?bids.map(b=>'<div class="row"><b>'+esc(b.vendor)+'</b><p>'+cash(b.price)+'　／　'+b.days+' 天</p><p>'+esc(b.note)+'</p></div>').join(''):'尚無回覆')+'</div>':chat())}function compare(){if(role!=='engineer')return home();let p=projects[ix];return head('BID COMPARISON','技術與商務比較',esc(p.name)+' · '+p.rev)+warn()+'<div class="box scroll"><table><tr><th>指標</th>'+p.bids.map(b=>'<th>'+esc(b.vendor)+'</th>').join('')+'</tr>'+[['未稅報價',b=>cash(b.price)],['工期',b=>b.days+' 天'],['示範技術符合度',b=>b.tech+'%'],['工作範圍',b=>esc(b.cover)],['技術優勢／偏離',b=>esc(b.note)]].map(r=>'<tr><td><b>'+r[0]+'</b></td>'+p.bids.map(b=>'<td>'+r[1](b)+'</td>').join('')+'</tr>').join('')+'</table></div>'}function chat(){let bids=role==='engineer'?projects[ix].bids:projects[ix].bids.filter(x=>x.vendor===vendor);let b=bids[vix]||bids[0];if(!b)return '<div class="box">目前沒有這家廠商的討論串。</div>';return '<div class="box" style="max-width:850px"><h2>個別廠商溝通</h2>'+(role==='engineer'?'<div class="field"><label>選擇廠商</label><select onchange="vix=+this.value;render()">'+bids.map((x,i)=>'<option value="'+i+'" '+(x===b?'selected':'')+'>'+esc(x.vendor)+'</option>').join('')+'</select></div>':'<p>目前廠商：'+esc(vendor)+'</p>')+b.msgs.map(x=>'<div class="message '+(x[0]===(role==='engineer'?'工程師':vendor)?'mine':'')+'"><small>'+esc(x[0])+'</small><div>'+esc(x[1])+'</div></div>').join('')+'<div class="field"><label>澄清訊息</label><textarea id="msg"></textarea></div><button class="btn" onclick="send()">儲存展示訊息</button></div>'}function send(){let b=(role==='engineer'?projects[ix].bids:projects[ix].bids.filter(x=>x.vendor===vendor))[vix]||projects[ix].bids.find(x=>x.vendor===vendor),s=el('msg').value.trim();if(b&&s){b.msgs.push([role==='engineer'?'工程師':vendor,s]);render()}}function bid(){let p=projects[ix],b=p.bids.find(x=>x.vendor===vendor);return head('VENDOR PROPOSAL','填寫技術與商務提案',esc(p.name))+warn()+'<div class="box" style="max-width:800px"><div class="field"><label>未稅報價（NT$）</label><input type="number" id="price" value="'+(b?.price||'')+'"></div><div class="field"><label>承諾工期（日曆天）</label><input type="number" id="days" value="'+(b?.days||'')+'"></div><div class="field"><label>工作服務範圍</label><textarea id="cover">'+esc(b?.cover||'')+'</textarea></div><div class="field"><label>技術優勢與偏離說明</label><textarea id="note">'+esc(b?.note||'')+'</textarea></div><button class="btn" onclick="saveBid()">儲存展示提案</button></div>'}function saveBid(){let price=+el('price').value,days=+el('days').value,cover=el('cover').value,note=el('note').value;if(!price||!days||!cover||!note)return alert('請完成必填資料');let p=projects[ix],b=p.bids.find(x=>x.vendor===vendor);if(b)Object.assign(b,{price,days,cover,note});else p.bids.push({vendor,price,days,cover,note,tech:0,msgs:[]});alert('已更新此瀏覽器的展示資料；未送到伺服器。');tab='offers';go('detail')}function newProject(){return head('CREATE RFQ','建立新詢價規範','輸入專案、版次與工作內容。')+warn()+'<div class="box" style="max-width:850px"><div class="field"><label>專案名稱</label><input id="pn"></div><div class="field"><label>報價截止日</label><input id="pd" type="date"></div><div class="field"><label>規範內文</label><textarea id="ps"></textarea></div><button class="btn" onclick="add()">建立展示專案</button></div>'}function add(){let name=el('pn').value.trim(),due=el('pd').value,scope=el('ps').value.trim();if(!name||!due||!scope)return alert('請完成必填欄位');projects.unshift({id:'RFQ-DEMO-'+(projects.length+1),name,due,scope,type:'其他',rev:'Rev. A',bids:[]});ix=0;go('detail')}function login(){return head('ROLE PREVIEW','展示角色切換','僅供介面展示；未經身分認證。')+warn()+'<div class="box" style="max-width:600px"><div class="field"><label>使用者角色</label><select id="role"><option value="engineer">專案工程師</option><option value="vendor">受邀廠商</option></select></div><div class="field"><label>模擬廠商（選廠商模式時）</label><select id="vendor"><option>永信工程</option><option>宏達機電</option><option>泰昇工業</option></select></div><button class="btn" onclick="role=el(\'role\').value;vendor=el(\'vendor\').value;vix=0;go(\'home\')">進入展示工作台</button></div>'}function render(){el('who').textContent=role==='engineer'?'工程師展示介面':'廠商展示：'+vendor;let menu=[['home','▦　工作總覽'],['list','▤　詢價專案'],[role==='engineer'?'compare':'bid',role==='engineer'?'▥　技術比價':'◇　我的報價'],['detail','◉　專屬問答'],['login','♙　切換角色']];el('menu').innerHTML=menu.map(x=>'<button class="'+(page===x[0]?'on':'')+'" onclick="'+(x[0]==='detail'?'tab=\'chat\';':'')+'go(\''+x[0]+'\')">'+x[1]+'</button>').join('');el('main').innerHTML=({home,list,detail,compare,chat,bid,new:newProject,login}[page]||home)()+'<p class="muted">SpecBridge 0.1 · 互動介面原型 · 禁止用於正式詢價或儲存機密資料</p>'}render();</script></html>
